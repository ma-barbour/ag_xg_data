name: Daily Apples & Ginos Pipeline

on:
  schedule:
    - cron: '0 5 * * *' 
  workflow_dispatch: 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: Allows the action to push the updated data files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # Pulls pre-compiled binaries to drastically speed up package installation

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidymodels
            any::xgboost
            any::readr
            any::stringr
            any::bundle
            any::rvest
            any::janitor
            any::jsonlite
            any::lubridate
            any::zoo
            any::arrow
            any::googledrive
            any::googlesheets4

      - name: Create Google Auth File
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          cat << EOF > gcp_auth.json
          $GCP_SERVICE_ACCOUNT_KEY
          EOF

      - name: Run R Script
        run: Rscript ag_xg_data_auto_github.R

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git rm --ignore-unmatch full_season_pbp.rds full_season_oi.rds
          git add *.parquet schedule.rds
          git commit -m "Auto-update season PBP and OI data" || echo "No data changes to commit"
          git push
